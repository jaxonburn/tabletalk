name: tabletalk

x-python: &python
  build:
    context: .
    dockerfile: services/Dockerfile
  environment: &python-environment
    ELASTICSEARCH_URL: http://elasticsearch:9200
    MATCHER_URL: http://matcher:8001
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_SERVICE_NAMESPACE: ${OTEL_SERVICE_NAMESPACE:-tabletalk}
    OTEL_PYTHON_INSTRUMENTATION_ELASTICSEARCH_CAPTURE_SEARCH_QUERY: omit
    PYTHONPYCACHEPREFIX: /tmp/tabletalk-pycache
    # Optional AI notes and personas. Keys stay in the services, never the browser.
    LLM_PROVIDER: ${LLM_PROVIDER:-none}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    WATCHFILES_FORCE_POLLING: "true"
  volumes:
    - ./services:/app/services
    - ./packages:/app/packages
  init: true
  depends_on:
    elasticsearch:
      condition: service_healthy
    otel-collector:
      condition: service_started

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
    depends_on:
      api:
        condition: service_healthy
    init: true

  api:
    <<: *python
    environment:
      <<: *python-environment
      OTEL_SERVICE_NAME: tabletalk-api
      # Optional: when set, /host and host API calls require this token.
      HOST_TOKEN: ${HOST_TOKEN:-}
      # How often the cutoff watcher checks for automatic matching.
      AUTO_MATCH_POLL_SECONDS: ${AUTO_MATCH_POLL_SECONDS:-10}
    command:
      - uvicorn
      - tabletalk_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - services/api/src
      - --reload-dir
      - packages/shared/src
      - --no-access-log
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      otel-collector:
        condition: service_started
      matcher:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 20

  matcher:
    <<: *python
    environment:
      <<: *python-environment
      OTEL_SERVICE_NAME: tabletalk-matcher
    command:
      - uvicorn
      - tabletalk_matcher.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
      - --reload-dir
      - services/matcher/src
      - --reload-dir
      - packages/shared/src
      - --no-access-log
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 20

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:9.2.0}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 2g
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' >/dev/null"
      interval: 5s
      timeout: 5s
      retries: 40

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro

volumes:
  elasticsearch-data:
