name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Validate cloud and Dash0 combinations
        env:
          ELASTICSEARCH_URL: https://elasticsearch.example.com:443
          ELASTICSEARCH_API_KEY: example-key
          DASH0_ENDPOINT: https://ingress.example.com
          DASH0_AUTH_TOKEN: example-token
        run: |
          docker compose -f compose.yaml -f compose.dash0.yaml config --quiet
          docker compose -f compose.yaml -f compose.elasticsearch-cloud.yaml config --quiet
          docker compose -f compose.yaml -f compose.elasticsearch-cloud.yaml -f compose.dash0.yaml config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 240
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - run: uv run python scripts/smoke.py
      - if: failure()
        run: docker compose logs --tail=80
      - if: always()
        run: docker compose down --volumes

  radar-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Kubernetes manifests
        run: kubectl kustomize infra/radar/deploy > /tmp/tabletalk-manifests.yaml
      - name: Validate the live Collector configuration
        run: |
          docker run --rm \
            -e DASH0_ENDPOINT=https://ingress.example.com \
            -e DASH0_AUTH_TOKEN=example-token \
            -e DASH0_DATASET=default \
            -v "$PWD/infra/radar/deploy/collector.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.123.0 \
            validate --config=/etc/otelcol/config.yaml
      - name: Build the release frontend
        run: docker build --target production -f apps/web/Dockerfile -t tabletalk-web:check .

  deploy:
    name: Publish and deploy to Radar
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, compose, radar-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: tabletalk-radar-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Skip superseded revisions
        id: revision
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main revision exists; its CI run will deploy it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.revision.outputs.current == 'true'
      - uses: docker/login-action@v3
        if: steps.revision.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.revision.outputs.current == 'true'
        with:
          context: .
          file: apps/web/Dockerfile
          target: production
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/tabletalk-web:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v6
        if: steps.revision.outputs.current == 'true'
        with:
          context: .
          file: services/Dockerfile
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/tabletalk-python:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Update GitOps image tags
        if: steps.revision.outputs.current == 'true'
        id: tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer main revision arrived during the build; skipping this release."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          yq -i '(.images[] | select(.name == "tabletalk-web" or .name == "tabletalk-python")).newTag = strenv(IMAGE_TAG)' infra/radar/deploy/kustomization.yaml
          echo "updated=true" >> "$GITHUB_OUTPUT"
      - name: Publish the generated deployment update
        if: steps.tags.outputs.updated == 'true'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: main
          file_pattern: infra/radar/deploy/kustomization.yaml
          commit_message: |
            deploy: ${{ github.sha }} [skip ci]

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
      - name: Verify the public release and backend readiness
        if: steps.tags.outputs.updated == 'true'
        run: |
          for attempt in $(seq 1 60); do
            if version=$(curl --fail --silent --show-error --max-time 10 https://tabletalk.cnh.radarhq.io/version.json | jq -er '.version') \
              && [ "$version" = "$GITHUB_SHA" ] \
              && curl --fail --silent --show-error --max-time 30 https://tabletalk.cnh.radarhq.io/api/health \
                | jq -e --arg version "$GITHUB_SHA" '.status == "ok" and .version == $version and .matcher_version == $version' > /dev/null \
              && curl --fail --silent --show-error --max-time 20 https://tabletalk.cnh.radarhq.io/api/conference > /dev/null; then
              echo "Release $GITHUB_SHA is live and the API is ready."
              exit 0
            fi
            echo "Waiting for Argo CD and backend readiness ($attempt/60)."
            sleep 10
          done
          echo "Deployment did not become ready. Check Argo CD, image visibility, and workload events in Radar." >&2
          exit 1
