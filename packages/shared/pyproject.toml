[project]
name = "tabletalk-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "elasticsearch[async]>=9.2,<10",
    "httpx>=0.28,<1",
    "opentelemetry-api>=1.31,<2",
    "opentelemetry-sdk>=1.31,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
    "opentelemetry-instrumentation-fastapi>=0.52b0,<1",
    "opentelemetry-instrumentation-httpx>=0.52b0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
