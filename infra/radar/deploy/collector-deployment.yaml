apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tabletalk-collector
  template:
    metadata:
      labels:
        app: tabletalk-collector
    spec:
      serviceAccountName: tabletalk-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.123.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          envFrom:
            - secretRef:
                name: tabletalk-dash0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: tabletalk-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app: tabletalk-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
