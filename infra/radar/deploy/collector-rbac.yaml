apiVersion: v1
kind: ServiceAccount
metadata:
  name: tabletalk-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tabletalk-collector
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tabletalk-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tabletalk-collector
subjects:
  - kind: ServiceAccount
    name: tabletalk-collector
    namespace: team-tabletalk
