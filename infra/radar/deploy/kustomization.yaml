apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-tabletalk
resources:
  - web.yaml
  - httproute.yaml
  - api.yaml
  - matcher.yaml
  - collector-deployment.yaml
  - collector-rbac.yaml
images:
  - name: tabletalk-web
    newName: ghcr.io/jaxonburn/tabletalk-web
    newTag: ce7c133ab48a112f7dbe172f5993ddc68a779c5c
  - name: tabletalk-python
    newName: ghcr.io/jaxonburn/tabletalk-python
    newTag: ce7c133ab48a112f7dbe172f5993ddc68a779c5c
configMapGenerator:
  - name: tabletalk-runtime
    literals:
      - MATCHER_URL=http://matcher:8001
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAMESPACE=tabletalk
      - OTEL_PYTHON_INSTRUMENTATION_ELASTICSEARCH_CAPTURE_SEARCH_QUERY=omit
      - PYTHONPYCACHEPREFIX=/tmp/tabletalk-pycache
      - PYTHONUNBUFFERED=1
      # AI settings (not secrets). Keys come from the optional tabletalk-llm Secret;
      # without them the host view reports AI as unavailable and uses templates/BM25.
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-5.4-mini
      - LLM_REASONING_EFFORT=low
      - EMBEDDING_MODEL=text-embedding-3-small
      - AUTO_MATCH_POLL_SECONDS=10
  - name: tabletalk-collector
    files:
      - config.yaml=collector.yaml
