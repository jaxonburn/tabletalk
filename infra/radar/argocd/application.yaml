apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: team-tabletalk
spec:
  project: team-tabletalk
  source:
    repoURL: https://github.com/jaxonburn/tabletalk.git
    targetRevision: main
    path: infra/radar/deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: team-tabletalk
  syncPolicy:
    syncOptions:
      - PruneLast=true
    automated:
      prune: true
      selfHeal: true
